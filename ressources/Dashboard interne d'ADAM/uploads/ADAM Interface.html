<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ADAM — Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --indigo:#6D5DF6; --indigo2:#7E70FF; --peri:#8E8BFF;
    --grad:linear-gradient(95deg,#FFC24B,#FF6FA5,#C16BFF,#6D5DF6);
    --sans:'Montserrat', system-ui, sans-serif;
  }
  /* ---- dark theme (default) ---- */
  [data-theme="dark"]{
    --bg:#0A0912; --solid:#15131F; --panel2:#1B1826;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
    --text:#F2F2F7; --muted:#9A9AB0; --faint:#62627A;
    --glass:rgba(255,255,255,.045); --glass-h:rgba(255,255,255,.09); --glass-bd:rgba(255,255,255,.12);
    --glass-hl:rgba(255,255,255,.14);
    --chrome:#0E0E18; --url:#1B1B28;
    --app:
      radial-gradient(105% 62% at 88% -8%, rgba(142,107,255,.28), transparent 52%),
      radial-gradient(96% 58% at 4% 108%, rgba(255,111,165,.20), transparent 50%),
      radial-gradient(82% 52% at 52% 122%, rgba(255,172,92,.10), transparent 60%),
      #0A0912;
    --bubble-adam:rgba(125,109,255,.10); --src-bg:rgba(109,93,246,.14); --src-tx:#C9C4FF;
    --scroll:rgba(255,255,255,.1);
  }
  /* ---- light theme ---- */
  [data-theme="light"]{
    --bg:#F1F0F7; --solid:#FFFFFF; --panel2:#FFFFFF;
    --line:rgba(22,23,43,.08); --line2:rgba(22,23,43,.13);
    --text:#16172B; --muted:#5C5A70; --faint:#9C99AC;
    --glass:rgba(255,255,255,.6); --glass-h:rgba(255,255,255,.92); --glass-bd:rgba(255,255,255,.85);
    --glass-hl:rgba(255,255,255,.9);
    --chrome:#FFFFFF; --url:#F1F0F6;
    --app:
      radial-gradient(105% 60% at 90% -8%, rgba(142,107,255,.20), transparent 50%),
      radial-gradient(96% 58% at 4% 108%, rgba(255,140,170,.18), transparent 50%),
      radial-gradient(82% 52% at 52% 122%, rgba(255,182,112,.12), transparent 60%),
      linear-gradient(180deg,#F7F5FC,#F0ECF7);
    --bubble-adam:#F1ECFB; --src-bg:rgba(109,93,246,.1); --src-tx:#5A48E8;
    --scroll:rgba(22,23,43,.14);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:#E6E5EC; font-family:var(--sans); -webkit-font-smoothing:antialiased; color:#16172B; }
  button{ font-family:inherit; cursor:pointer; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--scroll,rgba(0,0,0,.15)); border-radius:99px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ---------- review page ---------- */
  .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 20px 70px; }
  #root{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .page-head{ text-align:center; max-width:660px; margin-bottom:18px; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--indigo); margin:0 0 10px; }
  .eyebrow img{ width:20px; height:20px; }
  .page-title{ font-size:26px; font-weight:800; letter-spacing:-.02em; color:#16172B; margin:0 0 8px; }
  .page-sub{ font-size:14px; line-height:1.55; color:#5A586B; margin:0; }

  /* control bar */
  .controls{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:24px; }
  .seg{ display:inline-flex; gap:3px; background:#fff; border:1px solid #E0DEE8; border-radius:999px; padding:4px; box-shadow:0 6px 18px -10px rgba(20,18,40,.3); }
  .seg button{ display:inline-flex; align-items:center; gap:7px; border:none; background:none; font-size:12.5px; font-weight:700; color:#6C6A7E; padding:8px 15px; border-radius:999px; transition:all .18s; }
  .seg button svg{ display:block; }
  .seg button.on{ background:#16172B; color:#fff; }
  .seg.mini button{ padding:8px 13px; }

  /* ---------- fit stage ---------- */
  .stage{ position:relative; }
  .canvas{ position:absolute; top:0; left:0; transform-origin:top left; }

  /* ---------- glass primitive ---------- */
  .glass{ background:var(--glass); backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5); border:1px solid var(--glass-bd); box-shadow:inset 0 1px 0 var(--glass-hl); }

  /* ---------- desktop window chrome ---------- */
  .win{ width:1380px; height:858px; border-radius:18px; overflow:hidden; background:var(--bg); box-shadow:0 40px 90px -30px rgba(20,18,40,.55), 0 0 0 1px rgba(20,18,40,.12); display:flex; flex-direction:column; }
  .winbar{ height:46px; flex:0 0 auto; background:var(--chrome); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 16px; }
  .lights{ display:flex; gap:8px; }
  .lights i{ width:12px; height:12px; border-radius:50%; }
  .urlbar{ flex:1; max-width:420px; margin:0 auto; height:28px; border-radius:99px; background:var(--url); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; color:var(--muted); font-weight:600; }
  .urlbar svg{ opacity:.7; }

  /* phone */
  .phone{ width:402px; height:858px; border-radius:52px; background:var(--bg); overflow:hidden; box-shadow:0 40px 90px -30px rgba(20,18,40,.55), 0 0 0 1px rgba(20,18,40,.14), inset 0 0 0 8px #05050B; position:relative; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:16px; left:50%; transform:translateX(-50%); width:112px; height:31px; background:#05050B; border-radius:18px; z-index:60; }

  /* ---------- app shell ---------- */
  .app{ flex:1; min-height:0; display:flex; position:relative; background:var(--app); }

  /* ===== sidebar ===== */
  .side{ width:290px; flex:0 0 auto; border-right:1px solid var(--line); display:flex; flex-direction:column; position:relative; }
  .side-top{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 14px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:30px; height:30px; filter:drop-shadow(0 3px 9px rgba(109,93,246,.32)); }
  .brand b{ font-size:20px; font-weight:800; letter-spacing:.13em; background:linear-gradient(92deg,#6D5DF6 0%,#7E6BF8 45%,#A99BF5 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
  .ask-pill{ display:inline-flex; align-items:center; font-size:12px; font-weight:800; letter-spacing:.07em; color:var(--indigo); padding:7px 14px; border-radius:999px; background:rgba(109,93,246,.08); border:1px solid rgba(142,139,255,.34); }
  .ask-pill svg{ color:var(--peri); }

  .side-pad{ padding:6px 14px 0; }
  .newbtn{ position:relative; width:100%; height:50px; border-radius:999px; border:none; background:linear-gradient(100deg,#6D5DF6 0%,#9B62F0 50%,#E2638F 100%); color:#fff; font-size:14.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 9px 24px -10px rgba(155,98,240,.5), 0 3px 12px -6px rgba(226,99,143,.32), inset 0 1px 0 rgba(255,255,255,.28); transition:transform .14s, box-shadow .25s; }
  .newbtn:hover{ transform:translateY(-1px); box-shadow:0 13px 30px -10px rgba(155,98,240,.65), 0 4px 16px -6px rgba(226,99,143,.4), inset 0 1px 0 rgba(255,255,255,.32); }
  .newbtn:active{ transform:scale(.985); }

  .search{ margin-top:12px; height:42px; border-radius:13px; display:flex; align-items:center; gap:9px; padding:0 13px; color:var(--faint); }
  .search input{ flex:1; min-width:0; border:none; outline:none; background:none; color:var(--text); font-family:inherit; font-size:13.5px; }
  .search input::placeholder{ color:var(--faint); }

  .side-scroll{ flex:1; min-height:0; overflow-y:auto; padding:16px 8px 8px; }
  .grp{ font-size:10.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); padding:6px 10px; margin-top:6px; }
  .conv{ display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:12px; color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer; transition:all .15s; position:relative; border:1px solid transparent; }
  .conv:hover{ background:var(--glass); color:var(--text); }
  .conv.on{ color:var(--text); background:rgba(109,93,246,.14); border-color:rgba(142,139,255,.28); box-shadow:0 0 14px -10px rgba(109,93,246,.4); }
  .conv .ci{ color:var(--faint); flex:0 0 auto; display:flex; }
  .conv.on .ci{ color:var(--peri); }
  .conv .ct{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .tools-head{ display:flex; align-items:center; gap:9px; padding:6px 10px; margin-top:14px; }
  .soon{ font-size:9.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:#0C0C14; background:var(--grad); padding:3px 9px; border-radius:999px; box-shadow:0 0 11px -5px rgba(255,111,165,.4); }
  .tool{ display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:12px; color:var(--faint); font-size:13.5px; font-weight:600; cursor:not-allowed; opacity:.78; }
  .tool .ci{ flex:0 0 auto; display:flex; }
  .tool .lock{ margin-left:auto; display:flex; opacity:.7; }

  .side-foot{ flex:0 0 auto; border-top:1px solid var(--line); padding:12px; }
  .profile{ display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:13px; cursor:pointer; transition:background .15s; }
  .profile:hover{ background:var(--glass); }
  .ava{ width:38px; height:38px; border-radius:12px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; background:linear-gradient(140deg,#7E70FF,#9B62F0 55%,#E2638F); box-shadow:0 4px 14px -6px rgba(155,98,240,.5); }
  .pf-t{ flex:1; min-width:0; }
  .pf-t b{ display:block; font-size:13.5px; font-weight:700; color:var(--text); }
  .pf-t span{ font-size:11.5px; color:var(--faint); }

  /* ===== main ===== */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ height:66px; flex:0 0 auto; display:flex; align-items:center; gap:13px; padding:0 18px; }
  .icon-btn{ width:40px; height:40px; border-radius:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; transition:all .16s; flex:0 0 auto; position:relative; }
  .icon-btn:hover{ color:var(--text); background:var(--glass-h); transform:translateY(-1px); }
  .agent{ display:flex; align-items:center; gap:11px; }
  .agent-ava{ width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; background:radial-gradient(circle at 50% 35%, rgba(109,93,246,.22), transparent 70%), var(--glass); border:1px solid var(--glass-bd); box-shadow:0 0 14px -8px rgba(109,93,246,.4); }
  .agent-ava img{ width:25px; height:25px; }
  .agent-t b{ display:block; font-size:15px; font-weight:800; color:var(--text); letter-spacing:.02em; }
  .agent-t span{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); font-weight:600; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:#34D399; box-shadow:0 0 8px #34D399; }
  .top-right{ margin-left:auto; display:flex; align-items:center; gap:9px; }
  .pillseg{ display:inline-flex; gap:2px; border-radius:999px; padding:3px; }
  .pillseg button{ border:none; background:none; font-size:11.5px; font-weight:800; color:var(--faint); padding:6px 10px; border-radius:999px; transition:all .15s; letter-spacing:.03em; }
  .pillseg button.on{ background:var(--indigo); color:#fff; box-shadow:0 4px 12px -3px rgba(109,93,246,.7); }
  .bell-dot{ position:absolute; top:8px; right:9px; width:8px; height:8px; border-radius:50%; background:#FF6FA5; border:2px solid var(--bg); box-shadow:0 0 8px #FF6FA5; }
  .signout{ height:40px; padding:0 17px; border-radius:999px; color:var(--muted); font-size:13px; font-weight:700; transition:all .16s; }
  .signout:hover{ color:var(--text); background:var(--glass-h); }

  /* notifications panel */
  .notif{ position:absolute; top:60px; right:14px; width:336px; border-radius:18px; box-shadow:0 30px 70px -22px rgba(0,0,0,.65); z-index:80; overflow:hidden; animation:pop .2s ease; }
  @keyframes pop{ from{ opacity:0; transform:translateY(-7px) scale(.98) } to{ opacity:1; transform:none } }
  .notif-h{ display:flex; align-items:center; justify-content:space-between; padding:15px 17px; border-bottom:1px solid var(--line); }
  .notif-h b{ font-size:14px; font-weight:800; color:var(--text); }
  .notif-h span{ font-size:11.5px; font-weight:700; color:var(--indigo); cursor:pointer; }
  .nrow{ display:flex; gap:11px; padding:13px 17px; border-bottom:1px solid var(--line); transition:background .15s; }
  .nrow:last-child{ border-bottom:none; }
  .nrow:hover{ background:var(--glass); }
  .nrow .nic{ width:36px; height:36px; border-radius:11px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:rgba(109,93,246,.16); color:var(--peri); box-shadow:0 0 16px -5px rgba(109,93,246,.6); }
  .nrow.unread{ background:rgba(109,93,246,.06); }
  .nrow .nt{ flex:1; min-width:0; }
  .nrow .nt b{ font-size:13px; font-weight:700; color:var(--text); display:block; margin-bottom:2px; }
  .nrow .nt p{ margin:0; font-size:12px; line-height:1.45; color:var(--muted); }
  .nrow .nt time{ font-size:10.5px; color:var(--faint); font-weight:600; display:block; margin-top:5px; }

  /* chat */
  .chat{ flex:1; min-height:0; overflow-y:auto; padding:30px 0 14px; }
  .thread{ max-width:760px; margin:0 auto; padding:0 28px; display:flex; flex-direction:column; gap:26px; }
  .day-sep{ display:flex; align-items:center; gap:12px; color:var(--faint); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .day-sep::before, .day-sep::after{ content:''; height:1px; flex:1; background:var(--line); }

  .msg{ display:flex; gap:13px; max-width:100%; }
  .msg.me{ justify-content:flex-end; }
  .m-ava{ width:36px; height:36px; border-radius:11px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 35%, rgba(109,93,246,.22), transparent 70%), var(--glass); border:1px solid var(--glass-bd); box-shadow:0 0 13px -8px rgba(109,93,246,.4); }
  .m-ava img{ width:23px; height:23px; }
  .bubble{ border-radius:20px; padding:15px 18px; font-size:14.5px; line-height:1.6; max-width:80%; }
  .bubble.adam{ background:var(--bubble-adam); border:1px solid var(--glass-bd); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top-left-radius:8px; color:var(--text); box-shadow:0 8px 30px -16px rgba(20,18,40,.5); }
  .bubble.user{ background:linear-gradient(120deg,#6D5DF6,#8E5BF0 58%,#C75FB0); color:#fff; border-top-right-radius:8px; box-shadow:0 12px 30px -16px rgba(155,98,240,.6), inset 0 1px 0 rgba(255,255,255,.22); }
  .bubble p{ margin:0 0 10px; }
  .bubble p:last-child{ margin:0; }
  .bubble strong{ font-weight:700; color:var(--text); }
  .bubble.user strong{ color:#fff; }

  .src{ display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:9px 14px; border-radius:12px; background:var(--src-bg); border:1px solid rgba(142,139,255,.25); font-size:12.5px; color:var(--src-tx); font-weight:600; box-shadow:0 0 14px -10px rgba(109,93,246,.3); }
  .src svg{ flex:0 0 auto; }
  .src b{ color:var(--src-tx); font-weight:700; }

  .col{ display:flex; flex-direction:column; align-items:flex-start; max-width:80%; }
  .col-me{ align-items:flex-end; }
  .col-me .actions{ margin-left:0; margin-right:2px; }
  .actions{ display:flex; gap:3px; margin-top:10px; margin-left:2px; }
  .act{ width:34px; height:34px; border-radius:10px; border:none; background:none; color:var(--faint); display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .act:hover{ color:var(--text); background:var(--glass-h); }
  .act.done{ color:#34D399; }

  /* next-step rows (scenario format) */
  .ns-head{ font-size:10.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin:18px 0 12px 4px; }
  .clarify{ display:flex; flex-direction:column; gap:10px; margin-top:4px; width:100%; max-width:444px; }
  .clar{ display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:14px 17px; border-radius:16px; font-size:14.5px; font-weight:600; color:var(--text); transition:transform .16s, box-shadow .2s, border-color .2s; }
  .clar:hover{ transform:translateY(-1px); border-color:rgba(142,139,255,.5); box-shadow:inset 0 1px 0 var(--glass-hl), 0 0 22px -10px rgba(109,93,246,.45); }
  .clar-ic{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; background:rgba(109,93,246,.14); color:var(--peri); }

  /* ===== welcome / home ===== */
  .home{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px 24px; }
  .home-inner{ width:100%; max-width:600px; display:flex; flex-direction:column; align-items:center; }
  .home-logo{ width:84px; height:84px; display:flex; align-items:center; justify-content:center; margin-bottom:20px; filter:drop-shadow(0 12px 28px rgba(109,93,246,.5)); animation:homeLogoIn .6s cubic-bezier(.2,.9,.3,1.25) both; }
  .home-title{ font-size:34px; font-weight:800; letter-spacing:-.025em; color:var(--text); margin:0; text-align:center; }
  .home-title b{ font-weight:800; background:linear-gradient(92deg,#8E7BFF,#C78BFF 58%,#FF8FBF); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .home-phrase-wrap{ height:28px; margin:13px 0 34px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .home-phrase{ font-size:16px; font-weight:600; color:var(--muted); text-align:center; transition:opacity .36s ease, transform .36s ease; }
  .home-phrase.leaving{ opacity:0; transform:translateY(-9px); }
  .home-cards{ width:100%; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .home-cards.mcol{ grid-template-columns:1fr; }
  .home-card{ display:flex; align-items:center; gap:15px; width:100%; text-align:left; padding:16px 18px; border-radius:18px; transition:transform .16s, box-shadow .22s, border-color .22s; animation:cardIn .45s ease both; }
  .home-card:nth-child(2){ animation-delay:.06s } .home-card:nth-child(3){ animation-delay:.12s } .home-card:nth-child(4){ animation-delay:.18s }
  .home-card:not(.soon-card):hover{ transform:translateY(-2px); border-color:rgba(142,139,255,.5); box-shadow:inset 0 1px 0 var(--glass-hl), 0 16px 36px -16px rgba(109,93,246,.6); }
  .home-card.soon-card{ cursor:default; opacity:.62; }
  .hc-ic{ width:44px; height:44px; border-radius:13px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:rgba(109,93,246,.14); color:var(--peri); }
  .hc-t{ flex:1; min-width:0; }
  .hc-t b{ display:block; font-size:16px; font-weight:700; color:var(--text); }
  .hc-t span{ font-size:12.5px; color:var(--faint); font-weight:500; }
  .hc-chev{ color:var(--faint); flex:0 0 auto; display:flex; }
  .signin-link{ border:none; background:none; color:var(--indigo); font-weight:700; font-size:13px; padding:8px 13px; border-radius:999px; transition:background .15s; }
  .signin-link:hover{ background:var(--glass-h); }
  @keyframes homeLogoIn{ 0%{ opacity:0; transform:scale(.6) } 60%{ transform:scale(1.08) } 100%{ opacity:1; transform:scale(1) } }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }

  /* composer */
  .composer-wrap{ flex:0 0 auto; padding:14px 28px 12px; }
  .composer-inner{ max-width:760px; margin:0 auto; }
  .composer{ display:flex; align-items:flex-end; gap:10px; border-radius:22px; padding:9px 9px 9px 14px; transition:border-color .18s, box-shadow .25s; }
  .composer.focus{ border-color:rgba(142,139,255,.55); box-shadow:inset 0 1px 0 var(--glass-hl), 0 0 0 4px rgba(109,93,246,.13), 0 0 40px -10px rgba(109,93,246,.5); }
  .composer textarea{ flex:1; min-width:0; border:none; outline:none; background:none; resize:none; color:var(--text); font-family:inherit; font-size:14.5px; line-height:1.5; padding:9px 0; max-height:120px; }
  .composer textarea::placeholder{ color:var(--faint); }
  .comp-tools{ display:flex; align-items:center; gap:4px; }
  .comp-ic{ width:38px; height:38px; border-radius:12px; border:none; background:none; color:var(--faint); display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .comp-ic:hover{ color:var(--peri); background:var(--glass-h); }
  .send{ width:44px; height:44px; border-radius:50%; border:none; background:linear-gradient(135deg,#6D5DF6,#9B62F0 55%,#E2638F); color:#fff; display:flex; align-items:center; justify-content:center; transition:all .16s; box-shadow:0 7px 18px -8px rgba(155,98,240,.6), 0 2px 10px -4px rgba(226,99,143,.35), inset 0 1px 0 rgba(255,255,255,.28); }
  .send:hover{ transform:translateY(-1px) scale(1.03); box-shadow:0 10px 24px -8px rgba(155,98,240,.75), 0 4px 14px -4px rgba(226,99,143,.45), inset 0 1px 0 rgba(255,255,255,.34); }
  .disclaimer{ text-align:center; font-size:11.5px; color:var(--faint); margin:9px 0 2px; }

  /* ===== mobile ===== */
  .m-top{ flex:0 0 auto; padding:48px 14px 10px; display:flex; align-items:center; gap:12px; }
  .m-top .agent{ flex:1; justify-content:center; }
  .m-chat{ padding:18px 0 10px; }
  .m-thread{ padding:0 16px; gap:20px; }
  .m-thread .bubble{ max-width:84%; }
  .m-thread .col{ max-width:88%; }
  .m-composer{ padding:10px 14px calc(14px + env(safe-area-inset-bottom)); }
  .drawer-back{ position:absolute; inset:0; background:rgba(5,5,11,.5); backdrop-filter:blur(2px); z-index:90; animation:fade .2s ease; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .drawer{ position:absolute; top:0; left:0; bottom:0; width:302px; z-index:91; background:var(--bg); border-right:1px solid var(--line2); box-shadow:30px 0 60px -20px rgba(0,0,0,.5); animation:slidein .26s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; }
  @keyframes slidein{ from{ transform:translateX(-100%) } to{ transform:none } }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; } }
</style>

/* ---------- fit scaler ---------- */
function useFit(w, h){
  const ref = useRef(null);
  const [scale, setScale] = useState(1);
  const embed = typeof location!=='undefined' && /[?&]embed=1/.test(location.search);
  useLayoutEffect(()=>{
    function fit(){
      const el = ref.current; if(!el) return;
      const reserve = embed ? 96 : 240;
      setScale(Math.min(el.clientWidth/w, (window.innerHeight-reserve)/h, 1));
    }
    fit();
    window.addEventListener('resize', fit);
    return ()=> window.removeEventListener('resize', fit);
  }, [w, h]);
  return [ref, scale];
}

  }, [lang]);
  useEffect(()=>{
    if(/[?&]embed=1/.test(location.search)){
      const ph=document.querySelector('.page-head'); if(ph) ph.style.display='none';
      const pg=document.querySelector('.page'); if(pg) pg.style.paddingTop='14px';
    }
  }, []);
  return (
    <React.Fragment>
      <div className="controls">
        <div className="seg">
          <button className={view==='desktop'?'on':''} onClick={()=>setView('desktop')}><Ic d="desktop" s={16} /> Web Desktop</button>
          <button className={view==='mobile'?'on':''} onClick={()=>setView('mobile')}><Ic d="mobile" s={16} /> Mobile</button>
        </div>
        <div className="seg mini">
          <button className={theme==='light'?'on':''} onClick={()=>setTheme('light')}><Ic d="sun" s={15} /> Light</button>
          <button className={theme==='dark'?'on':''} onClick={()=>setTheme('dark')}><Ic d="moon" s={15} /> Dark</button>
        </div>
        <div className="seg mini">
          <button className={lang==='en'?'on':''} onClick={()=>setLang('en')}>EN</button>
          <button className={lang==='fr'?'on':''} onClick={()=>setLang('fr')}>FR</button>
        </div>
      </div>
      <div className="stage" ref={ref} style={{ width:'100%', maxWidth:W, height:H*scale }}>
        <div className="canvas" style={{ width:W, height:H, transform:`scale(${scale})`, left:'50%', marginLeft:-(W*scale)/2 }}>
          {view==='desktop'
            ? <Desktop theme={theme} setTheme={setTheme} lang={lang} />
            : <Mobile theme={theme} setTheme={setTheme} lang={lang} />}
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

</body>
